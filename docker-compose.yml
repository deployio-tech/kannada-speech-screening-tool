services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: kannada/web:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PYTHON_BACKEND_URL=http://python:5000
      - NODE_ENV=production
    depends_on:
      - python

  python:
    build:
      context: ./Python_services
      dockerfile: Dockerfile
    image: kannada/python-soda:latest
    ports:
      - "5001:5000"
    env_file:
      - .env
    environment:
      - PYTHON_PORT=5000
      - UPLOAD_FOLDER=/tmp/uploads

volumes:
  python_uploads:
